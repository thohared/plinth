# PLINTH_SPEC §3: guards → tsc → vitest. `npm run ci` is that chain; the
# Playwright browser is the no-network guard's (§2.2) only extra runtime need.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run ci
      - name: Performance diagnostic regressions
        run: node --test scripts/performance.test.mjs
      - name: Performance collector smoke (software GPU, no budget verdict)
        run: node scripts/performance.mjs --smoke --headless --software --out /tmp/plinth-perf-smoke --hardware 'GitHub Linux runner, software GPU, diagnostic only'
      - name: Preserve performance smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-smoke
          path: /tmp/plinth-perf-smoke/*.json
          if-no-files-found: ignore
