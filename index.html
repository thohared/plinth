<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="stylesheet" href="/src/ui/panel.css" />
    <title>Plinth — Screenshot studio</title>
    <meta name="description" content="Turn screenshots into studio-lit 3D device mockups. Choose your view, lighting and background, then export PNG. Free, no account; your image stays in your browser." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Plinth" />
    <meta property="og:title" content="Plinth — Screenshot studio" />
    <meta property="og:description" content="Your screenshot. A studio-lit 3D mockup. Export PNG, free, with no account." />
    <meta property="og:url" content="https://plinth-phi.vercel.app/" />
    <meta property="og:image" content="https://plinth-phi.vercel.app/social-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Plinth screenshot studio: turn screenshots into studio-lit 3D mockups. Export PNG. Free. No account." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Plinth — Screenshot studio" />
    <meta name="twitter:description" content="Your screenshot. A studio-lit 3D mockup. Export PNG, free, with no account." />
    <meta name="twitter:image" content="https://plinth-phi.vercel.app/social-card.png" />
    <meta name="twitter:image:alt" content="Plinth screenshot studio: turn screenshots into studio-lit 3D mockups. Export PNG. Free. No account." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  </head>
  <body>
    <main id="workspace"><canvas id="stage" aria-label="Plinth stage"></canvas></main>
    <aside id="panel" aria-label="Image settings"></aside>
    <button id="settings-open" type="button" aria-expanded="false" aria-controls="panel">Settings</button>
    <button id="pick" type="button" disabled>Choose image</button>
    <input id="image-file" type="file" accept="image/png,image/jpeg,image/webp" hidden />
    <p id="note" role="status" aria-live="polite"></p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
