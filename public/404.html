<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>Page not found | Plinth</title>
  <meta name="description" content="This page could not be found. Return to Plinth to create a screenshot mockup.">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; color: #172b25; background: #f7f5ec; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px; }
    main { width: 100%; max-width: 480px; }
    .brand { font-size: 24px; font-weight: 750; margin: 0 0 64px; }
    .code { font-size: 14px; letter-spacing: .12em; font-weight: 700; }
    h1 { font-size: clamp(32px, 7vw, 48px); line-height: 1.1; letter-spacing: -.04em; margin: 16px 0; }
    p { line-height: 1.6; }
    a { display: inline-flex; align-items: center; min-height: 48px; padding: 12px 20px; margin-top: 16px; background: #172b25; color: #f7f5ec; border-radius: 12px; text-decoration: none; font-weight: 650; }
    a:hover { background: #29483e; }
    a:focus-visible { outline: 3px solid #678b2f; outline-offset: 5px; }
    @media (prefers-color-scheme: dark) {
      :root { background: #172b25; color: #f7f5ec; }
      a { background: #d8ec9c; color: #172b25; }
      a:hover { background: #e7f4c2; }
    }
  </style>
</head>
<body>
  <main>
    <p class="brand">Plinth.</p>
    <p class="code">404</p>
    <h1>Page not found</h1>
    <p>This link may be incomplete, or the page may have moved.</p>
    <a href="/">Open screenshot studio</a>
  </main>
</body>
</html>
